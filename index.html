<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Quran Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="night" data-mode="image">

<div id="app">
  <header id="top">
    <span id="pageLabel">Page 1 / 854</span>
    <span id="zoomLabel">100%</span>
  </header>

  <div id="stageWrap">
    <main id="stage" tabindex="0" aria-label="Quran page">
      <img id="pageImg" alt="" hidden draggable="false" referrerpolicy="no-referrer">
      <iframe id="embed" title="Original Quran viewer" hidden referrerpolicy="no-referrer"></iframe>
    </main>

    <div id="status" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="statusText">Loading…</p>
      <div id="statusActions" hidden>
        <button type="button" id="retryBtn" data-act="retry">Try again</button>
        <button type="button" id="swapBtn" data-act="toggleMode">Use original viewer</button>
        <button type="button" data-act="openPanel">Go to page</button>
      </div>
    </div>
  </div>

  <nav id="panBar" class="row" aria-label="Move around the zoomed page" hidden>
    <button type="button" data-act="panL" aria-label="Move view left">◀</button>
    <button type="button" data-act="panU" aria-label="Move view up">▲</button>
    <button type="button" data-act="panD" aria-label="Move view down">▼</button>
    <button type="button" data-act="panR" aria-label="Move view right">▶</button>
  </nav>

  <nav id="bar" class="row" aria-label="Reader controls">
    <button type="button" id="prevBtn" data-act="prev" aria-label="Previous page">‹ Prev</button>
    <button type="button" id="nextBtn" data-act="next" aria-label="Next page">Next ›</button>
    <button type="button" class="zoomOnly" data-act="zoomOut" aria-label="Zoom out">−</button>
    <button type="button" class="zoomOnly" data-act="zoomIn" aria-label="Zoom in">+</button>
    <button type="button" class="zoomOnly" data-act="fit" aria-label="Reset zoom">Fit</button>
    <button type="button" id="goBtn" data-act="openPanel" aria-label="Go to page and options">Go</button>
  </nav>
</div>

<section id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
  <h2 id="panelTitle">Go to page</h2>

  <div class="field">
    <span>Page (1 – <span id="totalLabel">854</span>)</span>
    <div id="jumpValue" class="value" aria-live="polite">1</div>
    <input id="jumpInput" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Type a page number" hidden>
  </div>

  <div class="row six" aria-label="Change page number">
    <button type="button" data-act="step" data-step="-100">−100</button>
    <button type="button" data-act="step" data-step="-10">−10</button>
    <button type="button" data-act="step" data-step="-1">−1</button>
    <button type="button" data-act="step" data-step="1">+1</button>
    <button type="button" data-act="step" data-step="10">+10</button>
    <button type="button" data-act="step" data-step="100">+100</button>
  </div>

  <p id="jumpMsg" role="alert"></p>

  <div class="row two">
    <button type="button" id="jumpGo" data-act="jumpGo" class="primary">Open page</button>
    <button type="button" data-act="closePanel">Close</button>
  </div>

  <div class="row two">
    <button type="button" id="nightBtn" data-act="toggleNight">Night colours: On</button>
    <button type="button" data-act="typeNumber">Type number</button>
  </div>

  <div class="row two">
    <button type="button" id="modeBtn" data-act="toggleMode">Viewer: Page images</button>
  </div>

  <p id="saveNote" class="note"></p>
</section>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
